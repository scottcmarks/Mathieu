# Windows + Linux builds for Sporadic M12.
#
# MANUAL ONLY: this never runs on push or pull_request — only when you start it
# yourself from the Actions tab (or `gh workflow run desktop.yml`).
#
# Requires a repo secret TOOLBOX_PAT: a fine-grained PAT with read access to
# scottcmarks/Toolbox (the shared engine dependency), since GITHUB_TOKEN can't
# read another private repo. (Note: scottcmarks Actions may be paused by the
# billing/spending cap — see project memory — so a run may not start until that
# is lifted.)
name: Desktop (Windows + Linux) — manual

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for this run"
        required: false
        default: ""

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mathieu
        uses: actions/checkout@v4
        with:
          path: mathieu
      - name: Checkout Toolbox (engine dependency)
        uses: actions/checkout@v4
        with:
          repository: scottcmarks/Toolbox
          ref: develop
          token: ${{ secrets.TOOLBOX_PAT }}
          path: Toolbox
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Build Linux
        working-directory: mathieu/flutter
        run: |
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: sporadic-m12-linux
          path: mathieu/flutter/build/linux/*/release/bundle

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Mathieu
        uses: actions/checkout@v4
        with:
          path: mathieu
      - name: Checkout Toolbox (engine dependency)
        uses: actions/checkout@v4
        with:
          repository: scottcmarks/Toolbox
          ref: develop
          token: ${{ secrets.TOOLBOX_PAT }}
          path: Toolbox
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows
        working-directory: mathieu/flutter
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: sporadic-m12-windows
          path: mathieu/flutter/build/windows/x64/runner/Release
