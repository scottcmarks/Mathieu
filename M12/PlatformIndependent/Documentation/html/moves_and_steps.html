<h2>M12</h2>
<h3>Moves and Steps</h3>
A <dfn>step</dfn> is the smallest recorded change -- a single tick left or right, or a swap, or a combo move.
<p>
A <dfn>move</dfn> is a larger recorded change, differing only from a step in that a series of left or right ticks are treated as a single move.
