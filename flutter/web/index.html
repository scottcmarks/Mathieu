<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mathieu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mathieu</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Booklet deep links (#skin=…&lesson=…&swap=…&word=…).

    Flutter web's default hash URL strategy owns the fragment: it treats it as
    the route and clears anything it does not recognise, so by the time Dart's
    main() runs the fragment is already gone. Move it into the query string
    first — the router leaves the query alone, a static host ignores it (no
    rewrite rules needed, which was the point of using the fragment), and
    replaceState does not reload. lib/deeplink.dart reads whichever survives.

    This must run before flutter_bootstrap.js.
  -->
  <script>
    (function () {
      var h = window.location.hash;
      if (h.length > 1 && !window.location.search) {
        try {
          window.history.replaceState(
            null, '', window.location.pathname + '?' + h.substring(1));
        } catch (e) { /* deep link is a nicety; never block startup */ }
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Emscripten M12 engine (defines createMathieuEngine) + glue wrappers -->
  <script src="mathieu_engine.js"></script>
  <script src="mathieu_glue.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
